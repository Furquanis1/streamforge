server:
  port: 8081

grpc:
  server:
    port: 9090

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/streamforge?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: streamforge
    password: streamforge
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    hibernate:
      ddl-auto: update

streamforge:
  cloud:
    grpc-port: 9090
    idempotency-ttl-seconds: 86400
    sse-heartbeat-ms: 2000
