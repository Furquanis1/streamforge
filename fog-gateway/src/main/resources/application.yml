server:
  port: 8082

streamforge:
  fog:
    broker-url: tcp://localhost:1883
    client-id: streamforge-fog-gateway
    subscribe-topic: telemetry/raw/#
    cloud-grpc-host: localhost
    cloud-grpc-port: 9090
    batch-max-size: 100
    batch-flush-interval-ms: 1000
    wal-directory: ./wal
    wal-max-bytes: 52428800
    high-throughput-events-per-sec: 500
    min-compression-gain-ratio: 1.15

resilience4j:
  circuitbreaker:
    instances:
      fog-cloud:
        slidingWindowSize: 4
        minimumNumberOfCalls: 1
        failureRateThreshold: 50
        waitDurationInOpenState: 4s
        automaticTransitionFromOpenToHalfOpenEnabled: true
        permittedNumberOfCallsInHalfOpenState: 2
